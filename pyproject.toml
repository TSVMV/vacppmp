[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vacppmp"
version = "0.1.0"
description = "Zero-dependency PCAP visualizer: parse captures and draw host/protocol maps"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["pcap", "pcapng", "network", "visualization", "blue-team"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.scripts]
vacppmp = "vacppmp.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["vacppmp*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
